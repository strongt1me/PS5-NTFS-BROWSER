# Runs the project's own test suite (make test) on main and on every branch
# of the open pull requests, on a GitHub-hosted Linux runner. Lives only on
# the ci/pr-tests branch of this fork; it is not part of any pull request.
name: PR tests

on:
  push:
    branches: [ci/pr-tests]
  workflow_dispatch:

jobs:
  test:
    name: make test (${{ matrix.ref }})
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        ref:
          - main
          - fix/reader-bounds
          - fix/writer-checks
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.ref }}

      - name: Show the commit under test
        run: git log --oneline -3

      - name: Install test tools (ntfs-3g, setfattr)
        run: |
          sudo apt-get update
          sudo apt-get install -y ntfs-3g attr make gcc python3

      - name: Check FUSE
        run: |
          sudo modprobe fuse || true
          ls -l /dev/fuse

      # The tests mount images with ntfs-3g, which needs root.
      - name: make test
        run: sudo make test

  # The same branches built for the console with the PS5 payload SDK, as the
  # release workflow does, so code that only the host build saw is checked
  # against the real toolchain too.
  ps5-build:
    name: PS5 build (${{ matrix.ref }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      SDK_REF: a7685ce8e97ce1f8a4f38253a41d54241c9124f1
    strategy:
      fail-fast: false
      matrix:
        ref:
          - main
          - fix/reader-bounds
          - fix/writer-checks
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.ref }}

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18 wget make

      - name: Cache PS5 payload SDK
        id: sdk-cache
        uses: actions/cache@v6
        with:
          path: ~/ps5-payload-sdk
          key: ps5-sdk-${{ env.SDK_REF }}

      - name: Build PS5 payload SDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/ps5-payload-dev/sdk.git /tmp/sdk
          git -C /tmp/sdk checkout "$SDK_REF"
          make -C /tmp/sdk DESTDIR="$HOME/ps5-payload-sdk" install

      - name: Build the payload
        run: |
          make clean
          make ps5 PS5_PAYLOAD_SDK="$HOME/ps5-payload-sdk"
          ls -l ntfs-browser.elf
          sha256sum ntfs-browser.elf

      - name: Symbols the payload imports
        run: nm -D --undefined-only ntfs-browser.elf | awk '{print $NF}' | sort | tr '\n' ' '
